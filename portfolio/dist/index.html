  <body>
    <div id="root"></div>

    <!--
      Netlify Forms only detects forms it can see in the built static HTML.
      A React SPA never renders a <form> into the initial HTML that
      Netlify's crawler reads at deploy time, so this hidden duplicate
      exists purely so Netlify registers the "contact" form. It is never
      shown to visitors — the real, interactive form lives in
      src/components/Contact.jsx and submits to this same form name via
      fetch(). This is Netlify's documented pattern for SPA forms.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

  </body>
</html>
